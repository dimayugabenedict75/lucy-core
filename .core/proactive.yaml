# Lucy proactive system - settings. Edit, then restart Lucy Core.
# Defaults are shown; delete any line you do not want to change.
# A few things can also be changed live by asking Lucy (proactive_control): pause, mute, quiet hours.

enabled: true
user_name: Benny

# Your timezone. Quiet hours, rest days, repeat rules and tasks all follow it.
#   "Asia/Manila" (needs tzdata, which is in requirements.txt), "+08:00" (always works), "app" (= Settings > Timezone,
#   which was UTC for you), "utc", "system".
timezone: "Asia/Manila"

startup_delay_seconds: 5
tick_seconds: 10              # how often due reminders are checked
watch_interval_seconds: 60    # how often greetings / check-ins / alerts are considered

quiet_hours: {enabled: true, start: "23:00", end: "07:00"}  # no unprompted messages; tasks wait; reminders still fire
rest_days: [thursday]         # no check-ins, gentle greeting

reminders:
  compose: template           # template = instant | llm = Lucy rephrases (costs a model call)
  ignore_quiet_hours: true
  min_interval_minutes: 10
  max_active: 200
  catchup_recurring_minutes: 180 # a repeating reminder missed by longer than this is skipped, not replayed

delivery:
  session: active             # active = most recently used chat | default | <session id>
  voice: "off"                # off | reminders | all (speaks on this PC through Lucy Audio)
  sticker: true
  sticker_chance: 0.35
  stickers:
    greeting: [Happy, Cozy, Hopeful]
    checkin: [Cozy, Confused, Hopeful]
    alert: [Annoyed, Shocked]
    task: [Smug, Confident]
    reminder: []
  max_defer_seconds: 180      # how long a reminder waits for a running reply to finish

limits:
  max_per_hour: 3             # greetings / check-ins / alerts (reminders are exempt)
  max_per_day: 8
  ignored_backoff: true       # each unanswered message doubles the silence before the next
  stop_after_ignored: 4       # this many unanswered in a row -> no check-ins until you write

greeting: {enabled: true, min_gap_hours: 6, compose: llm}

checkin:
  enabled: true
  idle_minutes: 180
  idle_max_hours: 48
  hours: ["10:00", "20:00"]
  max_per_day: 1
  cooldown_minutes: 240
  skip_cooldown_minutes: 120
  on_rest_days: false

alerts:
  enabled: true
  model_error: true
  model_error_after_seconds: 90
  disk_free_gb: 5
  log_mb: 50
  cooldown_hours: 6

tasks:                       # schedule_task: Lucy works unattended, so tools are READ-ONLY
  enabled: true
  allowed_tools: [web_search, web_extract, read_local_file, list_local_files, find_file, recall_memory, search_conversations]
  max_rounds: 6
  timeout_seconds: 300
  retry_minutes: 10
  max_attempts: 3
  max_runs_per_day: 6

llm:
  timeout_seconds: 45
  max_tokens: 200
  temperature: 0.7
  idle_before_llm_seconds: 20  # never borrow the model while you are chatting

jobs:                        # P8 task queue: long, repeating and idle-time work (tool `task`, Settings > Tasks)
  enabled: true
  read_tools: [web_search, web_extract, read_local_file, list_local_files, find_file, recall_memory, search_conversations]
  blocked_tools: [task, core_change, user_tool, proactive_control]   # never available inside a job
  default_budget: {seconds: 1200, tool_calls: 60, tokens: 80000}    # per task; "Continue" adds another round
  max_budget: {seconds: 14400, tool_calls: 600, tokens: 800000}     # the most a task can ask for
  max_runs_per_day: 8          # started runs per day (Run now / Continue ignore the daily caps)
  max_tool_calls_per_day: 400
  max_seconds_per_day: 10800
  max_active: 30
  max_attempts: 3              # a run that errors is retried from its checkpoint
  retry_minutes: 10
  park_timeout_hours: 48       # an approval nobody answers counts as a denial after this long
  auto_start_model_full: false # false: a task the MODEL created with full tools waits for your OK in Settings > Tasks
  idle_start_minutes: 10       # "idle" tasks start after this much quiet
  report_max_chars: 1200
  keep_days: 60
  system_jobs: true            # reflection + weekly trace review run on the queue (false = their own loops, like before)
